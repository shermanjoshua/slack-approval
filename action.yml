name: slack-approval
description: Custom action to send approval request to Slack from GitHub Actions
author: varu3
inputs:
  custom-blocks:
    description: 'Custom blocks to display in Slack notification (JSON string)'
    required: false
    default: '[]'
  override-base-blocks:
    description: 'If true, replaces default workflow information with custom-blocks (keeps Approve/Reject buttons)'
    required: false
    default: 'false'
  message-header:
    description: 'Override the header text displayed in the Slack message (defaults to "<workflow name> Approval")'
    required: false
    default: ''
  message-fields:
    description: 'JSON array of {label, value} objects to replace default metadata fields'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for cancelling the workflow run on reject or timeout'
    required: false
    default: '${{ github.token }}'
outputs:
  approval-status:
    description: 'The result of the approval: approved, rejected, or timeout'
runs:
  using: "node24"
  main: "dist/index.js"
branding:
  icon: plus
  color: green
